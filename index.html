<style>
    #lock-screen {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(15px);
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .login-box {
        background: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        text-align: center;
        width: 300px;
    }
    /* Logo Styling */
    .login-logo {
        width: 120px;
        margin-bottom: 15px;
    }
    .login-box h2 { margin-top: 0; color: #007bff; font-size: 20px; }
    #passInput {
        width: 100%;
        padding: 10px;
        margin: 15px 0;
        border: 2px solid #ddd;
        border-radius: 8px;
        outline: none;
        text-align: center;
        font-size: 18px;
    }
    #loginBtn {
        background: #007bff;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        width: 100%;
    }
    #loginBtn:hover { background: #0056b3; }
    #errMsg { color: red; font-size: 12px; margin-top: 10px; display: none; }
</style>

<div id="lock-screen">
    <div class="login-box">
        <img src="https://static.wixstatic.com/media/6998bf_8033e1d27c44447dae60bed7b4de24bd~mv2.png" alt="Logo" class="login-logo">
        <h2>🔒 STOCK ACCESS</h2>
        <input type="password" id="passInput" placeholder="Enter Password">
        <button id="loginBtn">Unlock Dashboard</button>
        <p id="errMsg">Wrong Password</p>
    </div>
</div>

<style>
    /* Global Styles */
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f7f9;
        margin: 0;
        padding: 15px;
        color: #333;
    }
    /* ... (Table and search styles same as before) ... */
    #search {
        padding: 12px 15px;
        width: 100%;
        margin-bottom: 20px;
        border: 2px solid #ddd;
        border-radius: 8px;
        font-size: 16px;
        box-sizing: border-box;
        outline: none;
        transition: border-color 0.3s;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    #search:focus { border-color: #007bff; }
    .table-container {
        overflow-x: auto;
        background: white;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 14px 10px; border-bottom: 1px solid #eee; text-align: left; }
    th { background: #007bff; color: white; font-weight: 600; text-transform: uppercase; font-size: 13px; letter-spacing: 0.5px; }
    tr:hover { background-color: #f9f9f9; }

    @media screen and (max-width: 600px) {
        thead { display: none; }
        tr { display: block; margin-bottom: 15px; background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        td { display: flex; justify-content: space-between; padding: 8px 5px; border-bottom: 1px solid #f1f1f1; font-size: 14px; }
        td:last-child { border-bottom: none; }
        td::before { content: attr(data-label); font-weight: bold; color: #555; margin-right: 10px; text-transform: capitalize; }
    }
</style>

<input id="search" type="text" placeholder="🔍 Search records..." autocomplete="off">

<div class="table-container">
    <table>
        <thead id="thead"></thead>
        <tbody id="sheetData"></tbody>
    </table>
</div>

<script>
// --- PASSWORD LOGIC ---
const THE_PASSWORD = "store"; 

function validate() {
    const input = document.getElementById("passInput").value;
    const error = document.getElementById("errMsg");
    
    if (input === THE_PASSWORD) {
        sessionStorage.setItem("isAllowed", "true");
        document.getElementById("lock-screen").style.display = "none";
        loadData(); 
    } else {
        error.style.display = "block";
        document.getElementById("passInput").value = "";
    }
}

document.getElementById("loginBtn").addEventListener("click", validate);
document.getElementById("passInput").addEventListener("keypress", (e) => {
    if (e.key === "Enter") validate();
});

if (sessionStorage.getItem("isAllowed") === "true") {
    document.getElementById("lock-screen").style.display = "none";
}

// --- JS LOGIC (NO CHANGES) ---
let items = [];
let headers = [];
let lastSearch = "";

function parseCSV(text) {
    const rows = [];
    let row = [];
    let cell = "";
    let insideQuotes = false;
    for (let i = 0; i < text.length; i++) {
        const char = text[i];
        if (char === '"' && text[i + 1] === '"') { cell += '"'; i++; } 
        else if (char === '"') { insideQuotes = !insideQuotes; } 
        else if (char === ',' && !insideQuotes) { row.push(cell); cell = ""; } 
        else if ((char === '\n' || char === '\r') && !insideQuotes) {
            if (cell || row.length) { row.push(cell); rows.push(row); row = []; cell = ""; }
        } else { cell += char; }
    }
    if (cell || row.length) { row.push(cell); rows.push(row); }
    return rows;
}

async function loadData() {
    if (sessionStorage.getItem("isAllowed") !== "true") return;
    try {
        const res = await fetch("https://docs.google.com/spreadsheets/d/1O0H8iVkIk92U0W5HLLJG5pWtGkhPfBD7IysidXc5sYI/export?format=csv");
        const csv = await res.text();
        const rows = parseCSV(csv);
        headers = rows[0];
        items = [];
        for (let i = 1; i < rows.length; i++) {
            if (rows[i].length === 0) continue;
            let obj = {};
            headers.forEach((h, index) => { obj[h] = rows[i][index] || ""; });
            items.push(obj);
        }
        renderTableHeader();
        applyFilter(lastSearch);
    } catch (e) { console.error("Error loading data:", e); }
}

function renderTableHeader() {
    document.getElementById("thead").innerHTML = "<tr>" + headers.map(h => `<th>${h}</th>`).join("") + "</tr>";
}

function display(arr) {
    let html = "";
    arr.forEach(row => {
        html += "<tr>";
        headers.forEach(h => {
            html += `<td data-label="${h}">${row[h]}</td>`;
        });
        html += "</tr>";
    });
    document.getElementById("sheetData").innerHTML = html;
}

function applyFilter(q) {
    lastSearch = q.toLowerCase();
    let filtered = items.filter(row =>
        Object.values(row).some(v => v.toString().toLowerCase().includes(lastSearch))
    );
    display(filtered);
}

document.getElementById("search").addEventListener("input", function () {
    applyFilter(this.value);
});

setInterval(loadData, 10000);
if (sessionStorage.getItem("isAllowed") === "true") loadData();
</script>
